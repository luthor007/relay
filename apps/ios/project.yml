name: Relay

# Generated with xcodegen — `xcodegen generate` in this directory. The .xcodeproj
# is gitignored on purpose: a pbxproj is a merge-conflict generator, and every
# fact about the project worth reviewing is in this file instead.

options:
  bundleIdPrefix: glass.relay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode. Swift 6's strict concurrency checking is worth
    # adopting deliberately, with the actor boundaries designed rather than
    # discovered — not as a side effect of creating the project.
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR

targets:

  # The transport layer, as a framework so the tests can import it without
  # dragging in the app. Mirrors glasses/bridge (TypeScript) method for method.
  RelayKit:
    type: framework
    platform: iOS
    sources:
      - path: RelayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: glass.relay.kit
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  Relay:
    type: application
    platform: iOS
    sources:
      - path: Relay
        excludes:
          - Relay.entitlements
    dependencies:
      - target: RelayKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: glass.relay
        INFOPLIST_FILE: Relay/Info.plist
        # NEHotspotConfiguration needs an entitlement, and the entitlement needs
        # an App ID that has it enabled. See the file's own comment.
        CODE_SIGN_ENTITLEMENTS: Relay/Relay.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"

  RelayKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RelayKitTests
      # Transport.swift is carried into the test bundle as a *resource*, not
      # compiled twice. `CommandCatalogTests` re-parses it to prove that every
      # method on GlassesTransport has a tappable command behind it — the same
      # trick glasses/bridge plays against glasses/protocol/commands.py, and the
      # only way "every glasses command, by hand" stays true rather than
      # becoming a comment. Remove this entry and that test fails loudly rather
      # than passing vacuously.
      - path: RelayKit/Transport.swift
        buildPhase: resources
    dependencies:
      - target: RelayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: glass.relay.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:

  # The scheme CI runs. Deliberately points at RelayKit rather than the app:
  # these tests need no host application, so they run on any simulator without
  # installing anything.
  RelayKit:
    build:
      targets:
        RelayKit: all
        RelayKitTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - RelayKitTests

  Relay:
    build:
      targets:
        Relay: all
    run:
      config: Debug
